name: Validate Kubernetes 0.8 consumer

on:
  push:
    branches:
      - fix/7-kubernetes-0-8
    paths:
      - '.github/workflows/validate-7-kubernetes-0-8.yml'
      - 'package.json'
      - 'bun.lock'
      - '.changeset/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/7-kubernetes-0-8
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun update @ankhorage/contracts@^19.4.0 @ankhorage/kubernetes@^0.8.0
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - run: bun run docs
      - run: bun run format
      - run: bun run format:check
      - name: Persist validated baseline
        run: |
          rm .github/workflows/validate-7-kubernetes-0-8.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock .changeset README.md paradox .github/workflows/validate-7-kubernetes-0-8.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: persist Kubernetes 0.8 consumer baseline'
          git push origin HEAD:fix/7-kubernetes-0-8
