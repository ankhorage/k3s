name: Phase 10 TLS validation

# Validation retry after canonical lint cleanup.
on:
  push:
    branches:
      - feat/145-traefik-acme-tls
    paths:
      - '.github/workflows/phase10-tls-validate.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/145-traefik-acme-tls
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Regenerate dependency lock
        run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - run: bun run docs
      - run: bun run format:check
      - name: Persist validated artifacts
        run: |
          rm .github/workflows/phase10-tls-validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock README.md paradox .github/workflows/phase10-tls-validate.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh k3s TLS artifacts'
          git push origin HEAD:feat/145-traefik-acme-tls
