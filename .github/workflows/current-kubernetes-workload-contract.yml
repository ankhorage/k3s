name: Regenerate current Kubernetes workload contract lock

on:
  push:
    branches:
      - fix/current-kubernetes-workload-contract
    paths:
      - '.github/workflows/current-kubernetes-workload-contract.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-kubernetes-workload-contract
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate dependency lock
        run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run test
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run format:check
      - name: Commit validated lock
        run: |
          rm .github/workflows/current-kubernetes-workload-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock .github/workflows/current-kubernetes-workload-contract.yml
          git commit -m 'chore: update k3s dependency lock'
          git push origin HEAD:fix/current-kubernetes-workload-contract
